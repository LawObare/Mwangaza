server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;

    # Flutter web is a single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The entrypoint must always be revalidated so deploys show up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}