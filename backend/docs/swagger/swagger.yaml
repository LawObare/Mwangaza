basePath: /api
definitions:
  handlers.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  handlers.loginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/models.User'
    type: object
  handlers.registerRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      phone:
        type: string
    type: object
  handlers.smsRequest:
    properties:
      farm_id:
        type: integer
      message:
        type: string
      phone_number:
        type: string
    type: object
  models.Farm:
    properties:
      farmer:
        type: string
      id:
        type: integer
      last_sms_sent:
        type: string
      latitude:
        type: number
      longitude:
        type: number
      name:
        type: string
      phone:
        type: string
      soil_moisture:
        type: number
      temperature:
        type: number
    type: object
  models.Recommendation:
    properties:
      created_at:
        type: string
      farm_id:
        type: integer
      id:
        type: integer
      message:
        type: string
      priority:
        type: string
      reason:
        type: string
    type: object
  models.SatelliteData:
    properties:
      ndvi:
        type: number
      rain_probability:
        type: number
      soil_moisture:
        type: number
      temperature:
        type: number
      timestamp:
        type: string
      wind_speed:
        type: number
    type: object
  models.SmsLog:
    properties:
      id:
        type: integer
      message:
        type: string
      phone:
        type: string
      sent_at:
        type: string
      status:
        type: string
    type: object
  models.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      phone:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: Mwangaza Team
  description: Farm advisory dashboard API — satellite data, recommendations, SMS
    alerts.
  license:
    name: MIT
  title: Mwangaza API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates user and returns a JWT token
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.loginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Login
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new admin account
      parameters:
      - description: Registration payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Register a new user
      tags:
      - auth
  /farms:
    get:
      description: Returns every farm in the database
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Farm'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List all farms
      tags:
      - farms
  /farms/{id}:
    get:
      description: Returns one farm by its ID
      parameters:
      - description: Farm ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Farm'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get a single farm
      tags:
      - farms
  /health:
    get:
      description: Returns server status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - system
  /recommendation:
    get:
      description: Returns all recommendations, optionally filtered by farm_id
      parameters:
      - description: Filter by farm ID
        in: query
        name: farm_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Recommendation'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get recommendations
      tags:
      - recommendations
  /satellite:
    get:
      description: Fetches latest environmental data from SpaceIoTBox (or mock)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SatelliteData'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get satellite data
      tags:
      - satellite
  /sms:
    get:
      description: Returns all sent SMS messages
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.SmsLog'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get SMS history
      tags:
      - sms
  /sms/send:
    post:
      consumes:
      - application/json
      description: Sends an advisory SMS to a farmer's phone
      parameters:
      - description: SMS payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.smsRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Send an SMS
      tags:
      - sms
securityDefinitions:
  BearerAuth:
    description: Enter "Bearer <token>"
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
